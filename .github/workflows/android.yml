name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # این بخش چک می‌کند اگر فایل وجود داشت، اجازه دسترسی بدهد
    - name: Check and Set Gradle Permission
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
          echo "gradlew found and permission granted."
        else
          echo "ERROR: gradlew not found! Please add Gradle Wrapper files to your repository."
          exit 1
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
