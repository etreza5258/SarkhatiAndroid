name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Build with Gradle
      run: |
        # پیدا کردن پوشه‌ای که فایل settings.gradle در آن قرار دارد
        PROJECT_DIR=$(find . -name "settings.gradle" -exec dirname {} \;)
        
        if [ -z "$PROJECT_DIR" ]; then
          echo "ERROR: Could not find settings.gradle. Please check your folder structure."
          exit 1
        fi
        
        echo "Project found in: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # اگر فایل gradlew وجود داشت استفاده کن، در غیر این صورت از gradle استفاده کن
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        # پیدا کردن مسیر APK به صورت هوشمند
        path: |
          **/build/outputs/apk/debug/app-debug.apk
