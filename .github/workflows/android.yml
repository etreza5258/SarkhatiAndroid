name: Android CI/CD (No Wrapper Mode)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # حذف کش گریدل برای جلوگیری از تداخل

    # این مرحله به جای استفاده از gradlew، مستقیماً از دستور gradle استفاده می‌کند
    - name: Build with Gradle Wrapper alternative
      run: |
        # اگر فایل وجود داشت از آن استفاده کن، اگر نه از گریدل نصب شده استفاده کن
        if [ -f gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "gradlew not found, using system gradle..."
          gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/