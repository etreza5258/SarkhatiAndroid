
name: Build Sarkhati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Check Manifest
        run: |
          echo "Checking AndroidManifest.xml"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('MANIFEST XML IS VALID')"

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --info 2>&1 | tee build-log.txt

      - name: Show Java Errors
        if: always()
        run: |
          if [ -f build-log.txt ]; then
            grep -n -B 5 -A 5 -E 'error:|MainActivity.java' build-log.txt || true
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sarkhati-Build-Log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SarkhatiAndroid-APK
          path: app/build/outputs/apk/debug/app-debug.apk

